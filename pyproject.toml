[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayacardio-never-lose-a-heartbeat"
version = "0.2.0"
description = "Fault-tolerant synthetic biosignal pipeline for the MayaCardio Software Systems Engineer assessment"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "requests>=2.32,<3.0", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
pipeline = "pipeline.cli:main"
biosignal-demo-mock = "pipeline.demo_mock:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
